# nginx config for the static Divide & Conquer / Teile & Herrsche web app
server {
    listen 8083;
    listen [::]:8083;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # don't reveal the nginx version
    server_tokens off;

    # compress text files
    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json;

    # index.html loads all scripts with a fresh ?v= each time; revalidate everything (cheap via ETag)
    add_header Cache-Control "no-cache" always;

    # basic security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # never serve hidden files (e.g. .git, .env) should any end up in the image
    location ~ /\. {
        deny all;
    }
}
